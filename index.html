<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تۆمارکردنی پێوانەکان - ديزاینی خەیاتی</title>
    
    <!-- خطوط جوجل -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700&family=Tajawal:wght@400;500;700&display=swap');
    </style>
    
    <!-- مكتبة قص الصور (CSS) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" />

    <style>
        * {
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', 'Noto Sans Arabic', sans-serif;
            background-color: #f4e8eb;
            margin: 0;
            padding: 20px 0 80px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* --- شريط أدوات الصورة المتطور --- */
        #image-settings-panel {
            position: fixed;
            top: -150px; /* مخفي في الأعلى */
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 20px;
            border-radius: 30px;
            box-shadow: 0 5px 25px rgba(212, 154, 171, 0.5);
            z-index: 9999;
            display: flex;
            flex-wrap: wrap; /* يسمح بتعدد الأسطر في الشاشات الصغيرة */
            justify-content: center;
            gap: 15px;
            align-items: center;
            border: 2px solid #d49aab;
            transition: top 0.3s ease-in-out;
            backdrop-filter: blur(5px);
            width: max-content;
            max-width: 95vw;
        }

        #image-settings-panel.active {
            top: 15px; /* يظهر للمستخدم */
        }

        .settings-btn {
            background: #f2d5df;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .settings-btn:hover { background: #d49aab; color: white; }
        .settings-slider { width: 80px; cursor: pointer; }

        .slider-group {
            display: flex;
            align-items: center;
            gap: 5px;
            background: #fdf5f7;
            padding: 5px 10px;
            border-radius: 15px;
            border: 1px solid #f2d5df;
        }

        /* ------------- نافذة قص الصور (Modal) ------------- */
        #crop-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 10000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .crop-container {
            width: 90%;
            max-width: 500px;
            height: 60vh;
            background: #fff;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .crop-container img { max-width: 100%; max-height: 100%; display: block; }
        .crop-buttons { display: flex; gap: 15px; }
        .crop-buttons button { padding: 12px 25px; border: none; border-radius: 25px; font-size: 16px; font-weight: bold; font-family: inherit; cursor: pointer; transition: 0.2s; }
        .btn-confirm { background: #90c9b1; color: #fff; }
        .btn-confirm:hover { background: #7ab39c; transform: scale(1.05); }
        .btn-cancel { background: #ff4d4d; color: #fff; }
        .btn-cancel:hover { background: #e60000; transform: scale(1.05); }
        
        /* ------------------------------------------------ */

        .print-btn {
            background: linear-gradient(45deg, #d49aab, #e6b3c3);
            color: white;
            border: none;
            padding: 12px 35px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(212, 154, 171, 0.4);
            margin-bottom: 20px;
            z-index: 100;
        }

        .a4-paper {
            width: 210mm;
            height: 297mm;
            background-color: #ffffff;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            padding: 1.5cm; 
            position: relative;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 1.2cm; 
            width: 100%;
            height: 100%;
        }

        .measurement-card {
            border: 2px solid #f2d5df;
            border-radius: 15px;
            padding: 15px;
            background: linear-gradient(135deg, #ffffff 0%, #fff7f9 100%);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden; 
            box-shadow: inset 0 0 15px rgba(242, 213, 223, 0.3);
        }

        /* إعدادات الصور داخل الكرت */
        .draggable-img {
            position: absolute;
            cursor: move;
            z-index: 1; 
            transition: border 0.1s;
        }

        .selected-img {
            border: 2px dashed #d49aab;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(212, 154, 171, 0.5);
        }

        .card-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            height: 100%;
            pointer-events: none; 
        }

        .card-header, .measurement-item, .card-footer, .action-btn { pointer-events: auto; }

        .card-header { background: linear-gradient(to left, #ebd3da, #f5e1e7); color: #5c474e; font-weight: bold; font-size: 14px; padding: 6px 18px; border-radius: 20px; display: inline-flex; align-items: center; align-self: flex-start; margin-bottom: 15px; }
        .measurement-list { list-style: none; padding: 0; margin: 0; flex-grow: 1; }
        .measurement-item { display: flex; align-items: center; margin-bottom: 7px; font-size: 13.5px; color: #4a3e42; font-weight: bold; position: relative; }
        .checkbox-dot { width: 14px; height: 14px; background-image: url('https://cdn-icons-png.flaticon.com/512/3032/3032272.png'); background-size: cover; margin-left: 8px; display: inline-block; opacity: 0.7; }
        .line-space { flex-grow: 1; border-bottom: 1.5px dotted #d49aab; margin-right: 8px; height: 12px; opacity: 0.6; }
        .card-footer { margin-top: auto; background: rgba(255, 255, 255, 0.8); padding: 8px; border-radius: 10px; border: 1px dashed #f2d5df; margin-bottom: 35px; }
        .notes-header { color: #b56c82; font-size: 12px; font-weight: bold; margin-bottom: 6px; }
        .info-row { display: flex; justify-content: space-between; font-size: 11px; color: #5c474e; font-weight: bold; } 
        .info-field { display: flex; width: 48%; align-items: flex-end; }

        [contenteditable="true"] { outline: none; border-bottom: 1px solid transparent; transition: 0.2s; cursor: text; }
        [contenteditable="true"]:hover { background-color: rgba(255, 255, 255, 0.9); border-bottom: 1px dashed #d49aab; }

        .delete-text-btn { background: #d49aab; color: white; border: none; cursor: pointer; border-radius: 50%; width: 16px; height: 16px; font-size: 8px; position: absolute; right: 0; opacity: 0; transition: 0.2s; display: flex; justify-content: center; align-items: center;}
        .measurement-item:hover .delete-text-btn { opacity: 1; right: 5px; }

        .controls-container {
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 10;
            background: rgba(255,255,255,0.8);
            padding: 5px 15px;
            border-radius: 20px;
            border: 1px solid #f2d5df;
            pointer-events: auto;
        }

        .controls-container button { background: none; border: none; font-size: 18px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 5px; color: #b56c82; font-family: inherit; font-weight: bold; }
        .controls-container button:hover { transform: scale(1.1); color: #8e5a6a; }

        /* إعدادات الطباعة */
        @page { size: A4; margin: 1.5cm; }
        @media print {
            body { background: white; padding: 0; margin: 0; }
            .a4-paper { padding: 0; box-shadow: none; width: 100%; height: 100%; }
            .cards-grid { height: 267mm; }
            .print-btn, .controls-container, #image-settings-panel, .delete-text-btn, #crop-modal { display: none !important; }
            .selected-img { border: none !important; box-shadow: none !important; }
            .card-footer { margin-bottom: 0 !important; }
            [contenteditable="true"]:hover { background: none; border-bottom: transparent; }
        }
    </style>
</head>
<body>

    <!-- نافذة قص الصور -->
    <div id="crop-modal">
        <div class="crop-container">
            <img id="image-to-crop" src="">
        </div>
        <div class="crop-buttons">
            <button class="btn-confirm" onclick="applyCrop()">✅ قص وحفظ</button>
            <button class="btn-cancel" onclick="closeCropModal()">❌ إلغاء</button>
        </div>
    </div>

    <!-- لوحة تحكم الصورة -->
    <div id="image-settings-panel">
        <strong style="color:#b56c82; font-size: 14px;">أدوات الصورة:</strong>
        
        <!-- أداة تكبير/تصغير الحجم الجديدة -->
        <div class="slider-group">
            <span style="font-size: 11px; color:#5c474e; font-weight:bold;">الحجم 🔍</span>
            <input type="range" id="size-slider" class="settings-slider" min="30" max="350" step="5" value="100">
        </div>

        <!-- أداة الشفافية -->
        <div class="slider-group">
            <span style="font-size: 11px; color:#5c474e; font-weight:bold;">الشفافية 💧</span>
            <input type="range" id="opacity-slider" class="settings-slider" min="0.1" max="1" step="0.05" value="1">
        </div>

        <div style="display:flex; gap:5px;">
            <button class="settings-btn" onclick="openCropper()" title="قص الصورة">✂️</button>
            <button class="settings-btn" onclick="setLayer('front')" title="أمام النص">⬆️</button>
            <button class="settings-btn" onclick="setLayer('back')" title="خلف النص">⬇️</button>
            <button class="settings-btn" onclick="deleteActiveImg()" style="background:#ff7b93; color:white;" title="حذف">🗑️</button>
            <button class="settings-btn" onclick="closeSettings()" title="إغلاق">❌</button>
        </div>
    </div>

    <button class="print-btn" onclick="window.print()">🌸 طباعة الورقة (A4)</button>
    <input type="file" id="imageUploader" accept="image/*" style="display: none;">

    <div class="a4-paper">
        <div class="cards-grid">
            <!-- الكروت تتولد عبر السكربت -->
        </div>
    </div>

    <!-- مكتبة القص (JS) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <script>
        const cardsGrid = document.querySelector('.cards-grid');
        const cardTemplate = `
            <div class="measurement-card">
                <img src="https://cdn-icons-png.flaticon.com/512/8210/8210672.png" crossorigin="anonymous" class="draggable-img" style="bottom: 10px; left: 10px; width: 85px; opacity: 0.25; z-index: 1;" alt="فستان">
                <img src="https://cdn-icons-png.flaticon.com/512/6188/6188880.png" crossorigin="anonymous" class="draggable-img" style="top: -5px; right: -5px; width: 110px; opacity: 0.3; transform: rotate(15deg); z-index: 1;" alt="ورد">
                
                <div class="card-content">
                    <div class="card-header">👗 <span contenteditable="true" style="margin-right: 5px;">قوماشی خاتوو:</span></div>
                    <ul class="measurement-list">
                        <li class="measurement-item"><span class="checkbox-dot"></span> <span contenteditable="true">شان</span> <span class="line-space"></span> <button class="delete-text-btn" onclick="deleteField(this)">✖</button></li>
                        <li class="measurement-item"><span class="checkbox-dot"></span> <span contenteditable="true">سینگ</span> <span class="line-space"></span> <button class="delete-text-btn" onclick="deleteField(this)">✖</button></li>
                        <li class="measurement-item"><span class="checkbox-dot"></span> <span contenteditable="true">کەمەر</span> <span class="line-space"></span> <button class="delete-text-btn" onclick="deleteField(this)">✖</button></li>
                        <li class="measurement-item"><span class="checkbox-dot"></span> <span contenteditable="true">سەر شان تا کەمەر</span> <span class="line-space"></span> <button class="delete-text-btn" onclick="deleteField(this)">✖</button></li>
                        <li class="measurement-item"><span class="checkbox-dot"></span> <span contenteditable="true">درێژی قۆڵ</span> <span class="line-space"></span> <button class="delete-text-btn" onclick="deleteField(this)">✖</button></li>
                        <li class="measurement-item"><span class="checkbox-dot"></span> <span contenteditable="true">پانی قۆڵ</span> <span class="line-space"></span> <button class="delete-text-btn" onclick="deleteField(this)">✖</button></li>
                        <li class="measurement-item"><span class="checkbox-dot"></span> <span contenteditable="true">پانی پشت</span> <span class="line-space"></span> <button class="delete-text-btn" onclick="deleteField(this)">✖</button></li>
                        <li class="measurement-item"><span class="checkbox-dot"></span> <span contenteditable="true">باڵا</span> <span class="line-space"></span> <button class="delete-text-btn" onclick="deleteField(this)">✖</button></li>
                        <li class="measurement-item"><span class="checkbox-dot"></span> <span contenteditable="true">پەنجە</span> <span class="line-space"></span> <button class="delete-text-btn" onclick="deleteField(this)">✖</button></li>
                    </ul>
                    
                    <div class="card-footer">
                        <div class="notes-header"><span contenteditable="true">✎ تێبینی:</span></div>
                        <div class="info-row">
                            <div class="info-field"><span contenteditable="true">مۆبایل:</span> <span class="line-space"></span></div>
                            <div class="info-field"><span contenteditable="true">بەروار: / / 2024</span> <span class="line-space"></span></div>
                        </div>
                    </div>
                </div>

                <div class="controls-container">
                    <button onclick="triggerAddImage(this)" title="إضافة صورة">🖼️</button>
                    <button onclick="addField(this)" title="إضافة حقل">➕</button>
                </div>
            </div>
        `;
        
        cardsGrid.innerHTML = cardTemplate.repeat(4);

        /* ---------------- وظائف النصوص ---------------- */
        function deleteField(btn) { btn.parentElement.remove(); }
        function addField(btn) {
            const list = btn.closest('.measurement-card').querySelector('.measurement-list');
            const li = document.createElement('li');
            li.className = 'measurement-item';
            li.innerHTML = `<span class="checkbox-dot"></span> <span contenteditable="true">پێوانەی نوێ</span> <span class="line-space"></span> <button class="delete-text-btn" onclick="deleteField(this)">✖</button>`;
            list.appendChild(li);
        }

        /* ---------------- أدوات الصورة (الشفافية والحجم) ---------------- */
        let activeImage = null;
        let currentCard = null;
        const panel = document.getElementById('image-settings-panel');
        const opacitySlider = document.getElementById('opacity-slider');
        const sizeSlider = document.getElementById('size-slider'); // إضافة متغير الحجم
        const uploader = document.getElementById('imageUploader');

        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('draggable-img')) {
                if (activeImage) activeImage.classList.remove('selected-img');
                activeImage = e.target;
                activeImage.classList.add('selected-img');
                
                panel.classList.add('active');
                
                // قراءة القيم الحالية للصورة لضبط أشرطة التمرير عليها
                opacitySlider.value = activeImage.style.opacity || 1;
                
                let currentWidth = parseInt(window.getComputedStyle(activeImage).width) || 100;
                sizeSlider.value = currentWidth;
            } 
            else if (!e.target.closest('#image-settings-panel') && !e.target.closest('.controls-container') && !e.target.closest('#crop-modal')) {
                closeSettings();
            }
        });

        // تغيير الشفافية
        opacitySlider.addEventListener('input', function() {
            if (activeImage) { activeImage.style.opacity = this.value; }
        });

        // تغيير الحجم (التكبير والتصغير)
        sizeSlider.addEventListener('input', function() {
            if (activeImage) {
                activeImage.style.width = this.value + 'px';
            }
        });

        function closeSettings() {
            if (activeImage) activeImage.classList.remove('selected-img');
            activeImage = null;
            panel.classList.remove('active');
        }

        function setLayer(layer) {
            if (!activeImage) return;
            if (layer === 'front') activeImage.style.zIndex = '3'; 
            if (layer === 'back') activeImage.style.zIndex = '1';  
        }

        function deleteActiveImg() {
            if (activeImage) { activeImage.remove(); closeSettings(); }
        }

        /* ---------------- نظام القص (Cropper) ---------------- */
        let cropper = null;
        let imageBeingCropped = null;
        const cropModal = document.getElementById('crop-modal');
        const imageToCrop = document.getElementById('image-to-crop');

        function openCropper() {
            if (!activeImage) return;
            imageBeingCropped = activeImage;
            try {
                imageToCrop.src = imageBeingCropped.src;
                cropModal.style.display = 'flex';
                panel.classList.remove('active');
                if (activeImage) activeImage.classList.remove('selected-img');

                setTimeout(() => {
                    if (cropper) { cropper.destroy(); }
                    cropper = new Cropper(imageToCrop, { viewMode: 1, autoCropArea: 0.8, background: false });
                }, 50);
            } catch (error) {
                alert("حدث خطأ."); closeCropModal();
            }
        }

        function closeCropModal() {
            cropModal.style.display = 'none';
            if (cropper) { cropper.destroy(); cropper = null; }
        }

        function applyCrop() {
            if (cropper && imageBeingCropped) {
                try {
                    const canvas = cropper.getCroppedCanvas();
                    imageBeingCropped.src = canvas.toDataURL('image/png');
                    closeCropModal();
                    
                    setTimeout(() => { imageBeingCropped.click(); imageBeingCropped = null; }, 100);
                } catch (error) {
                    alert("لا يمكن قص الصور الافتراضية، يرجى رفع صورة من جهازك لقصها بنجاح.");
                    closeCropModal();
                }
            }
        }

        /* ---------------- رفع الصور ---------------- */
        function triggerAddImage(btn) {
            currentCard = btn.closest('.measurement-card');
            uploader.click();
        }

        uploader.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file && currentCard) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const newImg = document.createElement('img');
                    newImg.src = event.target.result;
                    newImg.className = 'draggable-img';
                    newImg.style.width = '100px';
                    newImg.style.top = '30%';
                    newImg.style.left = '30%';
                    newImg.style.opacity = '1';
                    newImg.style.zIndex = '3'; 
                    currentCard.appendChild(newImg);
                    
                    setTimeout(() => { newImg.click(); }, 50);
                };
                reader.readAsDataURL(file);
            }
            uploader.value = ''; 
        });

        /* ---------------- نظام السحب (Drag & Drop) ---------------- */
        let isDragging = false;
        let offsetX, offsetY;

        document.addEventListener('mousedown', startDrag);
        document.addEventListener('mousemove', drag);
        document.addEventListener('mouseup', endDrag);
        document.addEventListener('touchstart', startDrag, {passive: false});
        document.addEventListener('touchmove', drag, {passive: false});
        document.addEventListener('touchend', endDrag);

        function startDrag(e) {
            const target = e.target;
            if (target.classList.contains('draggable-img')) {
                e.preventDefault();
                target.style.left = target.offsetLeft + 'px';
                target.style.top = target.offsetTop + 'px';
                target.style.bottom = 'auto';
                target.style.right = 'auto';

                const clientX = e.clientX || e.touches[0].clientX;
                const clientY = e.clientY || e.touches[0].clientY;
                const rect = target.getBoundingClientRect();
                
                offsetX = clientX - rect.left;
                offsetY = clientY - rect.top;
                isDragging = true;
            }
        }

        function drag(e) {
            if (!isDragging || !activeImage) return;
            e.preventDefault();
            const clientX = e.clientX || e.touches[0].clientX;
            const clientY = e.clientY || e.touches[0].clientY;
            const parentRect = activeImage.parentElement.getBoundingClientRect();
            
            let newLeft = clientX - parentRect.left - offsetX;
            let newTop = clientY - parentRect.top - offsetY;

            activeImage.style.left = newLeft + 'px';
            activeImage.style.top = newTop + 'px';
        }

        function endDrag() { isDragging = false; }
    </script>
</body>
</html>
